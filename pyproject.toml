[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leniac_serv"
# version = "0.1.0"
dynamic = ["version"]
description = "A sample Python package"
readme = "README.md"
authors = [
    { name = "DOCTOR MOKIRA", email = "dr.mokira@gmail.com" },
    { name = "Giovanni MARC", email = "your.email@example.com" },
]
maintainers = [
    { name = "CONSOLE ART CYBERNETIC", email = "ca.cybernetic@gamil.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
keywords = ["llm-service", "chatbot", "chat-support"]
requires-python = ">=3.10"
dependencies = [
    "loguru==0.7.3",
    "django==5.2",
    "django-extensions",
    "django-cors-headers",
    "djangorestframework",
    "markdown",
    "django-filter",
    "djangorestframework-simplejwt",
    "drf-spectacular",
    "psycopg2",
    "python-dotenv",
    "gunicorn",
    "whitenoise==6.11.0",
]

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }

[project.urls]
# "Homepage" = "https://pyorigin.com"
# "Source" = "https://github.com/mokira3d48/Kobra/"
# "Documentation" = "https://docs.kobra.com"
# "Bug Reports" = "https://github.com/mokira3d48/PyOrigin/issues"
# "Changelog" = "https://github.com/mokira3d48/PyOrigin/releases"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
# mycmd = "package_name.entrypoints.main:main"
manage = "manage:main"
